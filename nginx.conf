# nginx del pannello — serve la build statica di Angular.
#
# Gira come utente non root (immagine nginx-unprivileged), quindi ascolta sulla
# 8080: le porte sotto la 1024 richiederebbero privilegi che in K8s non diamo.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Dietro un Ingress l'host e la porta reali sono quelli del proxy: un redirect
    # assoluto costruito da nginx punterebbe a :8080, irraggiungibile da fuori.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Probe di liveness/readiness: non tocca il filesystem e non finisce nei log.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Asset con hash nel nome (outputHashing: all): immutabili per definizione.
    location ~* \.(?:js|css|woff2?|ttf|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback SPA. Con outputMode "server" Angular NON genera un index.html nella
    # radice: le route prerenderizzate hanno il proprio (login/index.html), tutte
    # le altre vanno renderizzate lato client da index.csr.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.csr.html;
    }
}
